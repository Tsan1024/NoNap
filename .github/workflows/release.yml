name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for example v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in v*) ;; *) echo "Tag must start with v" >&2; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Build macOS app
        run: |
          set -euo pipefail
          TARGET="arm64-apple-macos13.0" ./macos/build.sh "$PWD/dist"
          codesign --verify --deep --strict "dist/NoNap.app"
          ditto -c -k --keepParent "dist/NoNap.app" "NoNap-${{ needs.prepare.outputs.version }}-macOS-arm64.zip"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: NoNap-${{ needs.prepare.outputs.version }}-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: NoNap-${{ needs.prepare.outputs.version }}-macOS-arm64.zip
          if-no-files-found: error

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows x64 app
        shell: pwsh
        run: |
          ./windows/build.ps1 -Version "${{ needs.prepare.outputs.version }}"
          Compress-Archive -Path windows/dist/win-x64/NoNap.exe `
            -DestinationPath "NoNap-${{ needs.prepare.outputs.version }}-Windows-x64-portable.zip"
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ needs.prepare.outputs.version }}" `
            "windows\installer\NoNap.iss"
          Copy-Item "windows/dist/installer/NoNap-${{ needs.prepare.outputs.version }}-Windows-x64-Setup.exe" .
      - name: Attest portable zip
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: NoNap-${{ needs.prepare.outputs.version }}-Windows-x64-portable.zip
      - name: Attest installer
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: NoNap-${{ needs.prepare.outputs.version }}-Windows-x64-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            NoNap-${{ needs.prepare.outputs.version }}-Windows-x64-portable.zip
            NoNap-${{ needs.prepare.outputs.version }}-Windows-x64-Setup.exe
          if-no-files-found: error

  publish:
    needs: [prepare, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Checksums and release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum NoNap-* | sort -k2 > SHA256SUMS)
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            awk '
              /^## \\[Unreleased\\]/ {flag=1; next}
              /^## \[/ && flag {exit}
              flag {print}
            ' CHANGELOG.md > NOTES.md
          fi
          {
            echo ""
            echo "---"
            echo "### Verify these downloads"
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify <asset> -R ${{ github.repository }}"
            echo '```'
          } >> NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file NOTES.md --title "NoNap $VERSION"
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "NoNap $VERSION" --notes-file NOTES.md
          fi
