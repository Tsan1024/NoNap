name: Feature request
description: Suggest an idea for NoNap
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        NoNap is deliberately small. Features that grow the platform privilege surface are
        unlikely to land. Ideas that keep it small, native, and honest are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, not just the feature.
      placeholder: When I'm running an overnight build I want…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require broader privileges, a background service, or a kernel extension.
          required: false
