name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. NoNap supports macOS 26 on Apple silicon and Windows 10/11
        on x64. Please include your platform details below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: I turned NoNap on, closed the lid, and the computer still slept…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open NoNap from the menu bar or system tray
        2. Toggle the switch on
        3. Close the lid (on battery)
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple silicon)
        - Windows 10 x64
        - Windows 11 x64
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and computer model
      placeholder: "macOS 26.5 / Mac17,7 or Windows 11 24H2 / laptop model"
    validations:
      required: true
  - type: textarea
    id: power-state
    attributes:
      label: Power state
      description: "macOS: pmset -g | grep SleepDisabled. Windows: powercfg /query SCHEME_CURRENT SUB_BUTTONS LIDACTION"
      render: shell
    validations:
      required: false
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install NoNap?
      options:
        - Built from source
        - Downloaded the macOS release zip
        - Downloaded the Windows installer
        - Downloaded the Windows portable zip
        - Homebrew tap (brew install --cask)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / console output
      render: shell
    validations:
      required: false
